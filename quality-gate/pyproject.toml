[project]
name = "quality-gate"
version = "0.1.0"
description = "Portable AI Quality Gate orchestrator"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
qg = "orchestrator.cli:main"

# flat-layout would otherwise abort on the config/sandbox/artifacts dirs
[tool.setuptools.packages.find]
include = ["orchestrator*", "skills*"]

[project.optional-dependencies]
test = ["pytest>=8", "coverage>=7", "fastapi", "django", "pytest-django", "httpx", "ruff", "black", "semgrep", "pip-audit"]

[tool.pytest.ini_options]
markers = ["integration: runs against real fixtures (needs docker + network)"]
addopts = "-m 'not integration'"
testpaths = ["tests"]
pythonpath = ["."]
